<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GULŠA | Creative Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;800&display=swap" rel="stylesheet">

    <style>
        /* Definícia základných pravidiel */
        :root {
            --accent-blue: #2563eb;
            --bg-dark: #020202;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important; /* Skrytie systémovej myši */
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambientné pozadie - vrstva, ktorá mení farby */
        #ambient-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* Počiatočný stav */
            background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.15) 0%, rgba(2, 2, 2, 1) 100%);
            transition: background 4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: background;
        }

        /* Vlastný kurzor (Šípka) */
        #cursor-main {
            position: fixed;
            top: 0;
            left: 0;
            width: 22px;
            height: 22px;
            background-color: var(--accent-blue);
            z-index: 10000;
            pointer-events: none;
            clip-path: polygon(0% 0%, 0% 100%, 25% 75%, 45% 100%, 55% 90%, 35% 65%, 70% 65%);
            will-change: transform;
        }

        /* Žiara pod kurzorom */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%); /* Centrovanie na hrot */
            will-change: transform;
        }

        /* Animované karty projektov */
        .project-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
            padding: 3rem;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-card:hover {
            transform: translateY(-12px);
            background: rgba(37, 99, 235, 0.05);
            border-color: var(--accent-blue);
        }

        /* Pomocné animácie pre Galériu */
        #gallery-grid img {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="ambient-layer"></div>
    <div id="cursor-glow"></div>
    <div id="cursor-main"></div>

    <nav class="p-10 flex justify-between items-center relative z-50">
        <div class="text-2xl font-extrabold tracking-tighter uppercase">
            Gulša<span class="text-blue-600">.</span>
        </div>
        <div class="space-x-8 text-[10px] font-bold uppercase tracking-[0.4em] text-zinc-500">
            <a href="#work" class="hover:text-white transition-colors">Portfolio</a>
            <a href="mailto:studiogulsatvedit@gmail.com" class="hover:text-white transition-colors">Kontakt</a>
        </div>
    </nav>

    <header class="h-[80vh] flex flex-col justify-center items-center text-center relative">
        <h1 class="text-9xl md:text-[13rem] font-black tracking-tighter uppercase leading-none select-none">
            GUL<span class="text-blue-600">ŠA</span>
        </h1>
        <p class="mt-6 text-zinc-500 uppercase tracking-[1em] text-sm">Creative Video Editor</p>
    </header>

    <section id="work" class="max-w-7xl mx-auto px-6 py-32">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-20">
            <button onclick="loadPortfolio('Gulša')" class="project-card text-left group">
                <span class="text-blue-500 text-xs font-bold tracking-widest uppercase block mb-2">2026</span>
                <h3 class="text-4xl font-black uppercase group-hover:italic transition-all">Gulša Personal</h3>
            </button>
        </div>

        <div id="portfolio-display" class="w-full bg-zinc-900/20 border border-white/5 rounded-[4rem] p-16">
            <h2 id="display-title" class="text-center text-5xl font-black uppercase mb-16 text-zinc-800 italic">Vyber projekt</h2>
            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
                </div>
        </div>
    </section>

    <footer class="py-32 text-center border-t border-white/5">
        <p class="text-zinc-600 text-[10px] uppercase tracking-[0.5em]">© 2026 Gulša Studio</p>
    </footer>

    <script>
        /**
         * 1. SYSTÉM PLYNULÉHO KURZORA (LERP)
         */
        const mainCursor = document.getElementById('cursor-main');
        const glowCursor = document.getElementById('cursor-glow');
        
        let mouseX = 0, mouseY = 0; // Reálna pozícia myši
        let currentX = 0, currentY = 0; // "Hladká" pozícia myši

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateCursor() {
            // Matematika plynulosti: 0.015 = veľmi vysoká plynulosť (zotrvačnosť)
            const lerpAmount = 0.015;
            
            currentX += (mouseX - currentX) * lerpAmount;
            currentY += (mouseY - currentY) * lerpAmount;

            // Aplikácia pohybu
            mainCursor.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            glowCursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;

            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        /**
         * 2. SYSTÉM ZMENY FARIEB POZADIA
         */
        const ambientBg = document.getElementById('ambient-layer');
        const gradientColors = [
            'radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.2) 0%, rgba(2, 2, 2, 1) 100%)', // Modrá
            'radial-gradient(circle at 50% 50%, rgba(147, 51, 234, 0.2) 0%, rgba(2, 2, 2, 1) 100%)', // Fialová
            'radial-gradient(circle at 50% 50%, rgba(20, 184, 166, 0.15) 0%, rgba(2, 2, 2, 1) 100%)' // Tyrkysová
        ];
        
        let colorCounter = 0;
        setInterval(() => {
            colorCounter = (colorCounter + 1) % gradientColors.length;
            ambientBg.style.background = gradientColors[colorCounter];
        }, 5000); // Zmena každých 5 sekúnd

        /**
         * 3. LOGIKA PORTFÓLIA (OBRÁZKY)
         */
        function loadPortfolio(client) {
            const grid = document.getElementById('gallery-grid');
            const title = document.getElementById('display-title');
            
            title.innerText = client;
            title.classList.remove('text-zinc-800');
            title.classList.add('text-white');
            grid.innerHTML = ""; // Vyčistenie

            if (client === 'Gulša') {
                const myImages = [
                    "ovjavil som crazy editovaci styl 1.jpg",
                    "objavil som crazy editovaci style - zuby timeline_.jpg",
                    "objavil som crazy editovaci style - 3d nahledak.jpg",
                    "pvp_king_nahledak_clutch.jpg",
                    "gulsa zapol omylom stream.jpg",
                    "reakcie na odhalenie.. nahledak.jpg",
                    "fps challenge w bright nahledak.jpg",
                    "fps challenge 2v2.jpg"
                ];

                myImages.forEach((imgName, index) => {
                    const imgElement = document.createElement('img');
                    // encodeURIComponent ošetrí medzery v názvoch súborov
                    imgElement.src = `Gulsa/${encodeURIComponent(imgName)}`;
                    imgElement.className = "thumb-img shadow-2xl";
                    imgElement.style.animationDelay = `${index * 0.1}s`;
                    
                    // Poistka pri chybe načítania
                    imgElement.onerror = () => {
                        console.error("Nepodarilo sa načítať: " + imgName);
                        imgElement.style.display = 'none';
                    };

                    grid.appendChild(imgElement);
                });
            }
        }
    </script>
</body>
</html>
