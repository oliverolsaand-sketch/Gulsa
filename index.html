<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Still On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ink:        #f4f1ea;
  --ink-dim:    rgba(244, 241, 234, 0.56);
  --bg:         #07080b;
  --amber:      #e8a35c;
  --edge:       rgba(244, 241, 234, 0.14);
  --serif: Georgia, "Times New Roman", serif;
  --sans:  system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body.is-ready { overflow: visible; }

.site-end::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: min(8rem, 40%); height: 1px;
  background: linear-gradient(90deg, transparent, var(--edge), transparent);
}

.loader {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: var(--bg);
  transition: opacity 0.7s ease, visibility 0.7s;
}
.loader.is-gone { opacity: 0; visibility: hidden; }
.loader-inner { width: min(280px, 70vw); text-align: center; }
.loader-label {
  font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-dim); margin-bottom: 1.1rem;
}
.loader-rail { height: 1px; background: var(--edge); overflow: hidden; }
.loader-bar {
  height: 100%; background: var(--amber);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
}
.loader-pct { margin-top: 0.9rem; font-size: 0.7rem; font-variant-numeric: tabular-nums; color: var(--ink-dim); }

.track { position: relative; }
.stage {
  position: sticky; top: 0;
  height: 100vh; height: 100svh;
  overflow: hidden; background: #000;
}
#seq { display: block; width: 100%; height: 100%; }

.stage-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,0.5) 100%),
    linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 45%);
}

.scroll-hint {
  position: absolute; left: 50%; bottom: 1.8rem;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
  font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--ink-dim); transition: opacity 0.5s ease;
}
.scroll-hint-rail { width: 1px; height: 3rem; background: var(--edge); overflow: hidden; }
.scroll-hint-rail i {
  display: block; width: 100%; height: 40%; background: var(--amber);
  animation: railDrop 2.1s ease-in-out infinite;
}
@keyframes railDrop {
  0%   { transform: translateY(-100%); }
  60%  { transform: translateY(250%); }
  100% { transform: translateY(250%); }
}

.after { position: relative; background: var(--bg); }

#turnStage {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(1.5rem, 5vw, 5rem);
  padding: 0 clamp(1.5rem, 6vw, 6rem);
  background: var(--bg);
}
.turn-figure { flex: 0 1 420px; height: 100%; display: flex; }
#turnSeq { display: block; width: 100%; height: 100%; }
.turn-copy { flex: 1 1 360px; order: 1; display: flex; align-items: center; }
.turn-figure { order: 2; }
.manifesto-copy {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.3rem, 2.4vw, 2rem);
  line-height: 1.4;
  text-align: left;
}
.manifesto-label {
  display: flex; align-items: center;
  margin-bottom: 1.4rem;
}
.manifesto-label i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); display: inline-block; }
.manifesto-line {
  display: inline-block;
  color: rgba(244, 241, 234, 0.14);
  filter: blur(3px);
  transform: translateY(0.15em);
  transition: color 1.1s cubic-bezier(0.22, 1, 0.36, 1), filter 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}
.manifesto-line.is-lit { color: var(--ink); filter: blur(0); transform: translateY(0); }
@media (max-width: 767px) {
  #turnStage { flex-direction: column; justify-content: center; padding: clamp(1.5rem, 6vw, 3rem); }
  .turn-copy { display: none; }
  .turn-figure { flex: 1 1 auto; width: 100%; order: 1; }
}

.intro {
  display: grid; place-content: center; text-align: center;
  padding: 1.25rem clamp(2rem, 8vw, 6rem);
}
.title {
  margin: 0; font-family: var(--serif); font-weight: 400;
  font-size: clamp(4rem, 15vw, 11rem); line-height: 0.9; letter-spacing: -0.03em;
}
.subtitle {
  margin: 1.1rem auto 0; max-width: 30rem;
  font-size: clamp(0.9rem, 1.6vw, 1.05rem); font-weight: 300; line-height: 1.5;
  color: var(--ink-dim); text-wrap: balance;
}

.sheet-section { position: relative; height: 230vh; }
.sheet-stage {
  position: sticky; top: 0;
  height: 100vh; height: 100svh;
  overflow: hidden; background: var(--bg);
  border-top: 1px solid var(--edge);
  cursor: crosshair;
  touch-action: pan-y;
}
